[package]
name = "kv-store"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode = "1.3"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"

[[bin]]
name = "main2"
path = "src/main2.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = false
debug = 2
