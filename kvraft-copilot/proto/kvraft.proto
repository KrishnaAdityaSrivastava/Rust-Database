
syntax = "proto3";

package kvraft.v1;

option go_package = "kvraft/api/gen/kvraft/v1;kvraftv1";

service KVStore {
  rpc Get (GetRequest) returns (KVResponse);
  rpc Set (SetRequest) returns (KVResponse);
  rpc Delete (DeleteRequest) returns (KVResponse);
  rpc Status (StatusRequest) returns (KVResponse);
}

message Value {
  oneof data {
    string string_value = 1;
    int64 int_value = 2;
    double float_value = 3;
  }
}

message GetRequest {
  string key = 1;
}

message SetRequest {
  string key = 1;
  Value value = 2;
}

message DeleteRequest {
  string key = 1;
}

message StatusRequest {}

message KVResponse {
  bool success = 1;
  Value value = 2;
  string message = 3;
  optional uint64 leader_id = 4;
  uint64 term = 5;
}
