<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%">
  <rect width="900" height="280" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
  <text x="450" y="40" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Raft Consensus State Transitions</text>

  <!-- Follower -->
  <circle cx="200" cy="160" r="55" fill="#161b22" stroke="#38bdf8" stroke-width="2"/>
  <text x="200" y="165" text-anchor="middle" fill="#38bdf8" font-family="sans-serif" font-size="16" font-weight="600">Follower</text>

  <!-- Candidate -->
  <circle cx="450" cy="160" r="55" fill="#161b22" stroke="#eab308" stroke-width="2"/>
  <text x="450" y="165" text-anchor="middle" fill="#eab308" font-family="sans-serif" font-size="16" font-weight="600">Candidate</text>

  <!-- Leader -->
  <circle cx="700" cy="160" r="55" fill="#161b22" stroke="#22c55e" stroke-width="2"/>
  <text x="700" y="165" text-anchor="middle" fill="#22c55e" font-family="sans-serif" font-size="16" font-weight="600">Leader</text>

  <!-- Transition Paths -->
  <path d="M 255 140 L 395 140" stroke="#8b949e" stroke-width="1.5"/>
  <text x="325" y="130" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="11">Times Out (Election)</text>

  <path d="M 505 140 L 645 140" stroke="#8b949e" stroke-width="1.5"/>
  <text x="575" y="130" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="11">Majority Votes</text>

  <path d="M 660 195 C 550 250 350 250 240 195" fill="none" stroke="#8b949e" stroke-width="1.5" stroke-dasharray="4"/>
  <text x="450" y="245" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="11">Discovers Higher Term / Step Down</text>
</svg>
